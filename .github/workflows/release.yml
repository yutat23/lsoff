name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Test
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "0"
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cgo: "0"
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ext: .exe
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
            cgo: "0"
            ext: .exe
          - os: ubuntu-latest
            goos: windows
            goarch: "386"
            cgo: "0"
            ext: .exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="lsoff-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "${name}" .
      - uses: actions/upload-artifact@v7
        with:
          name: lsoff-${{ matrix.goos }}-${{ matrix.goarch }}
          path: lsoff-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  # Requires repo secret HOMEBREW_TAP_TOKEN: a PAT with contents:write on yutat23/homebrew-tap.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          repository: yutat23/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        working-directory: homebrew-tap
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "../dist/$1" | awk '{print $1}'; }
          darwin_arm64=$(sha lsoff-darwin-arm64)
          darwin_amd64=$(sha lsoff-darwin-amd64)
          linux_arm64=$(sha lsoff-linux-arm64)
          linux_amd64=$(sha lsoff-linux-amd64)
          cat > Formula/lsoff.rb <<EOF
          class Lsoff < Formula
            desc "CLI/TUI for listing listening TCP/UDP ports"
            homepage "https://github.com/yutat23/lsoff"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/yutat23/lsoff/releases/download/v${version}/lsoff-darwin-arm64"
                sha256 "${darwin_arm64}"
              end
              on_intel do
                url "https://github.com/yutat23/lsoff/releases/download/v${version}/lsoff-darwin-amd64"
                sha256 "${darwin_amd64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/yutat23/lsoff/releases/download/v${version}/lsoff-linux-arm64"
                sha256 "${linux_arm64}"
              end
              on_intel do
                url "https://github.com/yutat23/lsoff/releases/download/v${version}/lsoff-linux-amd64"
                sha256 "${linux_amd64}"
              end
            end

            def install
              os = OS.mac? ? "darwin" : "linux"
              arch = Hardware::CPU.arm? ? "arm64" : "amd64"
              binary = "lsoff-#{os}-#{arch}"
              chmod "+x", binary
              bin.install binary => "lsoff"
            end

            test do
              assert_match "lsoff #{version}", shell_output("#{bin}/lsoff --version")
            end
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lsoff.rb
          git diff --cached --quiet && exit 0
          git commit -m "lsoff ${version}"
          git push

  # Requires repo secret WINGET_CREATE_GITHUB_TOKEN: a PAT that can write to
  # yutat23/winget-pkgs and submit a PR to microsoft/winget-pkgs.
  winget:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Verify token
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "Repository secret WINGET_CREATE_GITHUB_TOKEN is not configured."
          }
      - name: Sync WinGet fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          gh api --method POST repos/yutat23/winget-pkgs/merge-upstream -f branch=master
      - name: Submit WinGet update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $baseUrl = "https://github.com/yutat23/lsoff/releases/download/v${version}"
          $releaseUrl = "https://github.com/yutat23/lsoff/releases/tag/v${version}"

          & .\wingetcreate.exe update yutat23.lsoff `
            --version $version `
            --urls `
              "${baseUrl}/lsoff-windows-amd64.exe|x64" `
              "${baseUrl}/lsoff-windows-arm64.exe|arm64" `
              "${baseUrl}/lsoff-windows-386.exe|x86" `
            --release-notes-url $releaseUrl `
            --submit `
            --no-open

          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate failed with exit code $LASTEXITCODE."
          }
