name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o lsoff .
      - name: Cross-build
        if: runner.os == 'Linux'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null .
